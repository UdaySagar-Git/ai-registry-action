name: 'TruffleHog Secret Scan'

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'
      - 'master'

permissions:
  contents: read

concurrency:
  group: trufflehog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history without transmitting candidates
        env:
          TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 # v3.97.0
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            "$TRUFFLEHOG_IMAGE" \
            git file:///repo \
            --no-verification \
            --no-update \
            --fail \
            --fail-on-scan-errors \
            --github-actions
