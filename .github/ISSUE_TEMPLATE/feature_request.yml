name: Feature request
description: Suggest a change to ai-registry Action. Changes to aireg or the manifest format belong in atlanai/ai-registry.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private repository content or vulnerability details. Report security issues through SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pull-request preview
        - Publishing
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The behavior you would like, including any new input or output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
