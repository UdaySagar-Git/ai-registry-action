  <text x="500" y="388" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4A5654">One comment per pull request · no secrets for registries a pull request changes · publishes only from the default branch</text>
