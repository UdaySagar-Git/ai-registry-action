    <clipPath id="readme-header-card">
      <rect x="320" y="136" width="392" height="212" rx="12"/>
    </clipPath>
  </defs>
  <rect width="1000" height="420" fill="#FFFFFF"/>

  <text x="40" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#17201F"><tspan fill="#0F6E56">ai</tspan>-registry</text>
  <rect x="264" y="47" width="148" height="34" rx="17" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="338" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#085041">GitHub Action</text>
  <text x="960" y="56" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4A5654">See what a pull request publishes before it merges.</text>
  <text x="960" y="80" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4A5654">Publish it when it lands on the default branch.</text>

