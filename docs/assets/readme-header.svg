  <line x1="716" y1="244" x2="772" y2="244" stroke="#0F6E56" stroke-width="1.2"/>
  <circle cx="772" cy="244" r="3" fill="#0F6E56"/>
  <text x="744" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0F6E56">merge</text>

  <rect x="40" y="176" width="224" height="136" rx="10" fill="#FFFFFF" stroke="#B9C2BF"/>
