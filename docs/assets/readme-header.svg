<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="readme-header-title readme-header-desc">
  <title id="readme-header-title">ai-registry GitHub Action</title>
  <desc id="readme-header-desc">A pull request that edits skills/review and adds agents/triage gets one preview comment listing what merging publishes to the engineering namespace of the acme registry, and an unchanged export left alone; after the merge, the action publishes review 0.3.2 and triage 0.1.0 there.</desc>
